[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "jsonl-seek"
version = "0.1.0"
description = "Verified JSONL byte indexes with strict parsing and stale or tampered offset rejection."
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"
dependencies = []
[project.scripts]
jsonl-seek = "jsonl_seek:main"
[tool.setuptools]
py-modules = ["jsonl_seek"]
